# 웹 버전: main 에 올라오면 빌드해서 GitHub Pages 로 배포한다 (dist/index.html 한 파일)
name: Deploy web version
on:
  push:
    branches: [main]
    paths: ['src/**', 'web/**', 'data/**', 'templates/**', 'index.html', 'package.json', 'package-lock.json', 'vite.config.js', 'tools/inject_data.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Smoke check
        run: |
          test -s dist/index.html
          grep -q 'id="icons"' dist/index.html
          grep -q 'id="root"' dist/index.html
      - run: mkdir -p site && cp dist/index.html site/index.html && cp -r web/. site/ && touch site/.nojekyll   # web/download → /download/ (Windows 버전 받기)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
